<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TensorFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
</head>
<body>
  <h1>TensorFlow</h1>
  <p>Formula: y = 2x + 6</p>

  <button onclick="trainModel()">Entrenar Modelo</button>
  <input type="number" id="inputX" placeholder="Valor de X">
  <button onclick="makePrediction()">Predecir</button>
  
  <p id="output"></p>

  <script>
    let model;
    let modelEntrenado = false;

    async function trainModel() {
  
      model = tf.sequential();
      model.add(tf.layers.dense({units: 1, inputShape: [1]}));

      model.compile({
        loss: 'meanSquaredError',
        optimizer: 'sgd'
      });

 
      const xs = tf.tensor2d([-1, 0, 1, 2, 3, 4], [6, 1]);
      const ys = tf.tensor2d([-3, -1, 1, 3, 5, 7], [6, 1]);


      document.getElementById('output').innerText = 'Entrenando modelo...';
      await model.fit(xs, ys, {
        epochs: 350
      });

      document.getElementById('output').innerText = 'Modelo entrenado y listo para predecir.';
      modelEntrenado = true;
    }

    async function makePrediction() {
      const inputX = parseFloat(document.getElementById('inputX').value);

      if (!modelEntrenado) {
        document.getElementById('output').innerText = 'Primero debes entrenar el modelo.';
        return;
      }

      const inputTensor = tf.tensor2d([inputX], [1, 1]);
      const prediction = model.predict(inputTensor);
      const result = await prediction.data();

      document.getElementById('output').innerText = `El resultado de predecir para ${inputX} es: ${result[0]}`;
    }
  </script>
</body>
</html>
